    name: private_projects
    type: quota
    metric: projects
    limit: 3
  - label: Public projects
    name: public_projects
    type: quota
    metric: projects
    limit: -1
    note: Unlimited
  - label: Impulse experiments
    name: experiments
    type: quota
    metric: experiments_per_project
    limit: 10
  - label: Collaborators
    name: collaborators
    type: quota
    metric: collaborators_per_project
    limit: 3
  - label: Compute time per job
    name: compute_time
    type: quota
    metric: minutes_per_job
    limit: 60
