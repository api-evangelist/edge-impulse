description: 'Edge Impulse publishes exactly two plans: Developer at $0 and Enterprise at custom pricing.
  Every value below is read from the published pricing page and its plan-comparison table on 2026-09-06.
  This REPLACES a 2026-05-04 bulk-sweep scaffold that invented three tiers and per-request quotas Edge
  Impulse does not sell — Edge Impulse does not meter API requests at all. It meters compute time, memory,
  projects, collaborators and deployed device count, and it gates production use behind a licence rather
  than a quota.'
plan_count: 2
currency: USD
metering_model: resource-and-licence, not per-request
plans:
- id: edge-impulse-developer
  name: Developer
  type: freemium
  price: '0.00'
  currency: USD
  billingPeriod: month
  description: Free plan for individual developers, students and universities. Licensed for internal R&D
    and pre-production use only — development, testing, training, demoing and prototyping. Production
    use requires Enterprise.
  signup: https://studio.edgeimpulse.com/signup
  entries:
