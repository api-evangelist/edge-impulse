  - label: CPU compute memory
    name: cpu_memory
    type: quota
    metric: gigabytes
    limit: 16
  - label: Device deployments
    name: device_deployments
    type: quota
    metric: devices
    limit: 1000
  - label: Performance calibration synthetic data
    name: perf_cal_synthetic
    type: quota
    metric: minutes
    limit: 30
  elements:
  - name: GPU training
  - name: GenAI-assisted labeling
  - name: EON Tuner (default parameters, limited search-space customization)
  - name: EON Compiler (Edge Impulse-trained models only; excludes RAM-optimized mode)
  - name: Data explorer
  - name: Data pipelines (data sources limited to within the project)
  - name: Custom DSP blocks
  - name: Custom ML blocks
  - name: GenAI synthetic data generation
  - name: DSP autotuner
  - name: Learned optimizer
  - name: Time-series data augmentation
  - name: FOMO
  - name: GMM anomaly detection
  - name: Visual anomaly detection (FOMO-AD)
  - name: Multi-label support
  - name: Classical ML
  - name: HR & HRV DSP blocks (testing only)
  - name: API access — limited
  - name: 'Support: community forum and documentation'
