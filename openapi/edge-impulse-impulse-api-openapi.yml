      - type: object
        required:
        - transferLearningModels
        properties:
          transferLearningModels:
            type: array
            items:
              $ref: '#/components/schemas/TransferLearningModel_2'
    BlockThreshold:
      type: object
      description: Configurable threshold for this block (e.g. minimum score before tagging as an anomaly, or the min. score to save bounding boxes)
      required:
      - key
      - description
      - helpText
      - value
      properties:
        key:
          type: string
          description: Identifier to reference the threshold. You'll need to refer to the threshold by this key when you set the threshold).
          example: min_score
        description:
          type: string
          description: User-friendly description of the threshold.
          example: Score threshold
        helpText:
          type: string
          description: Additional help text (shown in the UI under a "?" icon)
          example: Threshold score for bounding boxes. If the score for a bounding box is below this the box will be discarded.
        suggestedValue:
          type: number
          description: If the threshold has a suggested value, e.g. a max. absolute error for regression projects; or the min. anomaly score for visual anomaly detection, then this is the numeric value of that threshold.
        suggestedValueText:
          type: string
          description: If the threshold has a suggested value, e.g. a max. absolute error for regression projects; or the min. anomaly score for visual anomaly detection, then this is the stringified value of that threshold.
        value:
          description: Current value of the threshold
          example: 0.5
          oneOf:
          - type: number
          - type: string
        dropdownOptions:
          description: Optional list of options, will be shown in a dropdown.
          type: array
          items:
            type: object
            required:
            - description
            - value
            properties:
              description:
                type: string
                description: Full description of the value
              value:
                type: string
                description: Value, maps back to "BlockThreshold#value"
    BlockType_2:
      type: string
      enum:
      - official
      - personal
      - enterprise
      - community
    ModelPrediction_2:
      type: object
      required:
      - sampleId
      - startMs
      - endMs
      - prediction
      properties:
        sampleId:
          type: integer
        startMs:
          type: number
        endMs:
          type: number
        label:
          type: string
        prediction:
          type: string
        predictionCorrect:
          type: boolean
        f1Score:
          type: number
          description: Only set for object detection projects
        anomalyScores:
          type: array
          description: Only set for visual anomaly projects. 2D array of shape (n, n) with raw anomaly scores, where n varies based on the image input size and the specific visual anomaly algorithm used. The scores corresponds to each grid cell in the image's spatial matrix.
          items:
            type: array
            items:
              type: number
        boundingBoxes:
          type: array
          description: Only set for object detection projects. Coordinates are scaled 0..1, not absolute values.
          items:
            $ref: '#/components/schemas/BoundingBoxWithScore'
        labelMapPredictions:
          type: object
          description: For samples with structured labels (in the form of a key/value label map), this object will contain per-key prediction info for the sample.
          additionalProperties:
            type: string
    SetImpulseThresholdsResponse:
      allOf:
      - $ref: '#/components/schemas/GenericApiResponse'
      - type: object
        required:
        - hadModelTestingResults
        - regenerateModelTestingStatus
        properties:
          hadModelTestingResults:
            description: Whether there were model testing results available before calling this function.
            type: boolean
          regenerateModelTestingStatus:
            description: 'Altering thresholds invalidates model testing results. We try to regenerate the results where possible.

              You''ll get either

              "not_regenerated" (e.g. no model testing results, or dataset does not support fast regeneration, like for object detection models);

              "regenerated" (regeneration successful);

              "started_job" (regenerate is possible, but requires a job, that was kicked off - e.g. for large test sets);

              "requires_job" (requires a job, but "allowCreatingRegenerateModelTestingJobs" was false - start a new job manually via regenerateModelTestingSummary).

              If a job was started then "regenerateModelTestingResultsJobId" is set.

              '
            type: string
            enum:
            - not_regenerated
            - regenerated
            - started_job
            - requires_job
          regenerateModelTestingResultsJobId:
            description: 'If there previously were model testing results, and your dataset supports fast re-generation of model testing results

              (e.g. no object detection blocks), but your dataset is too big to re-generate results inline (e.g. >20K test set samples) -

              then a job is kicked off to regenerate the results. This field contains the job ID.

              '
            type: integer
