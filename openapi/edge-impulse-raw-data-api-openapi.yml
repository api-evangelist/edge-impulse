              type: number
        cropStart:
          type: integer
          description: New start index of the cropped sample
          example: 0
        cropEnd:
          type: integer
          description: New end index of the cropped sample
          example: 128
        intervalMs:
          type: number
          description: Interval between two windows (1000 / frequency). If the data was resampled, then this lists the resampled interval for this payload.
          example: 16
        frequencyHz:
          type: number
          description: Frequency of the sample. If the data was resampled, then this lists the resampled frequency for this payload.
          example: 62.5
