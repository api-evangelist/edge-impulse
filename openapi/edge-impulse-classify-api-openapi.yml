                    type: integer
                  bad:
                    type: integer
              summaryPerClass:
                type: object
                additionalProperties:
                  type: object
                  required:
                  - good
                  - bad
                  properties:
                    good:
                      type: integer
                    bad:
                      type: integer
              confusionMatrixValues:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: number
              allLabels:
                type: array
                items:
                  type: string
              accuracyScore:
