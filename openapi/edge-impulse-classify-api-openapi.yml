    ClassifySampleResponseClassification_2:
      type: object
      required:
      - learnBlock
      - result
      - resultCount
      - expectedLabels
      - minimumConfidenceRating
      - thresholds
      - intervalMs
      - frequencyHz
      properties:
        learnBlock:
          $ref: '#/components/schemas/ImpulseLearnBlock_2'
        result:
          type: array
          description: Classification result, one item per window.
          example:
          - idle: 0.0002
            wave: 0.9998
            anomaly: -0.42
          items:
            type: object
            description: Classification value per label. For a neural network this will be the confidence, for anomalies the anomaly score.
            additionalProperties:
              type: number
        anomalyResult:
          type: array
          description: Anomaly scores and computed metrics for visual anomaly detection, one item per window.
          items:
            $ref: '#/components/schemas/AnomalyResult'
        structuredResult:
          type: array
          description: Results of inferencing that returns structured data, such as object detection
          items:
            $ref: '#/components/schemas/StructuredClassifyResult'
        minimumConfidenceRating:
          type: number
          description: DEPRECATED, see "thresholds" instead. The minimum confidence rating for this block. For regression, this is the absolute error (which can be larger than 1).
        details:
          type: array
          description: Structured outputs and computed metrics for some model types (e.g. object detection), one item per window.
          items:
            $ref: '#/components/schemas/ClassifySampleResponseClassificationDetails'
        objectDetectionLastLayer:
          $ref: '#/components/schemas/ObjectDetectionLastLayer_2'
        expectedLabels:
          type: array
          description: An array with an expected label per window.
          items:
            $ref: '#/components/schemas/StructuredLabel_2'
        expectedAnomalyOutcome:
          type: array
          description: 'An array with the expected anomaly outcome for each window — either “anomaly” or “no anomaly”. The outcome is determined by which labels are marked as anomalous in the project setup, or by the sample label if no such configuration is defined.

            '
          items:
            $ref: '#/components/schemas/StructuredLabel_2'
        thresholds:
          type: array
          description: List of configurable thresholds for this block.
          items:
            $ref: '#/components/schemas/BlockThreshold'
        isMultiLabel:
          type: boolean
        intervalMs:
          description: Interval between two windows in "expectedLabels" (1000 / frequency).
          type: number
        frequencyHz:
          description: Frequency of the windows in "expectedLabels"
          type: number
        labelMapResult:
          type: array
          description: Structured classification results, one item per window
          items:
            type: object
            additionalProperties:
              type: string
        labelMapScores:
          type: array
          description: Structured classification scores, one item per window
          items:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: number
        resultCount:
          type: integer
          description: Number of classification result windows for this block. For structured outputs this can be greater than the length of "result".
    BlockThreshold:
      type: object
      description: Configurable threshold for this block (e.g. minimum score before tagging as an anomaly, or the min. score to save bounding boxes)
      required:
      - key
      - description
      - helpText
      - value
      properties:
        key:
          type: string
          description: Identifier to reference the threshold. You'll need to refer to the threshold by this key when you set the threshold).
          example: min_score
        description:
          type: string
          description: User-friendly description of the threshold.
          example: Score threshold
        helpText:
          type: string
          description: Additional help text (shown in the UI under a "?" icon)
          example: Threshold score for bounding boxes. If the score for a bounding box is below this the box will be discarded.
        suggestedValue:
          type: number
          description: If the threshold has a suggested value, e.g. a max. absolute error for regression projects; or the min. anomaly score for visual anomaly detection, then this is the numeric value of that threshold.
        suggestedValueText:
          type: string
          description: If the threshold has a suggested value, e.g. a max. absolute error for regression projects; or the min. anomaly score for visual anomaly detection, then this is the stringified value of that threshold.
        value:
          description: Current value of the threshold
          example: 0.5
          oneOf:
          - type: number
          - type: string
        dropdownOptions:
          description: Optional list of options, will be shown in a dropdown.
          type: array
          items:
            type: object
            required:
            - description
            - value
            properties:
              description:
                type: string
                description: Full description of the value
              value:
                type: string
                description: Value, maps back to "BlockThreshold#value"
