    x-apievangelist-phrasing:
      intent: Restore a project from a saved version
      effect: destructive
      questions:
      - How do I restore an empty project to one of my saved versions?
      - Will restoring a version overwrite my impulse and settings?
      instructions:
      - text: Restore project {targetProjectId} to version {versionId} of project {sourceProjectId} using API key {projectApiKey}.
        slots:
          targetProjectId: path.projectId
          versionId: requestBody.versionId
          sourceProjectId: requestBody.projectId
          projectApiKey: requestBody.projectApiKey
      - text: Roll empty project {targetProjectId} back to private version {versionId}.
        slots:
          targetProjectId: path.projectId
          versionId: requestBody.versionId
      method: generated
      generated: '2026-10-01'
