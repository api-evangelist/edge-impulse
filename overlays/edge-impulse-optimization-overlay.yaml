- target: $.info
  description: 'Record the runtime semantics an agent cannot derive from this contract: HTTP 200 does
    not mean success, and there is no idempotency key.'
  update:
    x-error-semantics:
      style: envelope-in-200
      schema: GenericApiResponse
      rule: Branch on body.success, never on the HTTP status code. This contract declares only 200 responses.
      artifact: errors/edge-impulse-problem-types.yml
    x-idempotency:
      coverage: none
      header: null
      rule: No idempotency key exists. A retried POST starts a second job. Record the returned job id
        before retrying.
      artifact: conventions/edge-impulse-conventions.yml
    x-reversibility:
      grade: documented
      rule: cancelJob reverses a running job; deletes have no documented undo and no retention window.
        Create a project version (startVersionJob) before destructive work.
      artifact: conventions/edge-impulse-conventions.yml
    x-pagination:
      style: limit/offset
      artifact: conventions/edge-impulse-conventions.yml
