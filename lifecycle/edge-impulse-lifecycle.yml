description: Versioning, deprecation and operational-transparency posture. Edge Impulse runs a real Atlassian
  Statuspage covering the Studio API and Ingestion, and publishes an SLA figure on the Enterprise plan.
  It does NOT publish an API deprecation policy, sunset dates, RFC 8594 Deprecation/Sunset headers, or
  a dated API changelog — four operations are flagged deprecated in the contract with no removal date
  attached to any of them.
api_versioning:
  scheme: single path segment
  current: v1
  base_url: https://studio.edgeimpulse.com/v1
  spec_version: 1.0.0 (info.version in the published OpenAPI)
  note: No version header, no media-type versioning, no dated versions. Individual operations are versioned
    in the operationId instead (classifySample / classifySampleV2, classifySampleByLearnBlock / classifySampleByLearnBlockV2)
    — the old and new operations coexist on the same /v1 base.
protocol_versioning:
  surface: Remote Management WebSocket
  current: 3
  negotiated_in: the Hello message
  history:
  - version: 1
    note: Original protocol.
  - version: 2
    note: Sensor type changed from a string to a complex type describing frequencies and maximum sample
      length; documented defaults are applied for v1 devices.
  - version: 3
    note: Added progress percentages for sampleReading and commands for snapshot streaming; v2 devices
      get supportsSnapshotStreaming = false.
  source: https://docs.edgeimpulse.com/tools/protocols/remote-management/websocket#version-history
  note: This is the only versioned surface Edge Impulse publishes a written history for, and it is backward
    compatible by design — old device versions keep working with documented defaults.
