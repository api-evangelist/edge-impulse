- aid: edge-impulse:edge-impulse-ingestion-api
  name: Edge Impulse Ingestion API
  description: >-
    The Ingestion API sends new device data into an Edge Impulse project. It accepts sensor (JSON/CBOR/CSV/Parquet),
    audio (WAV), image (JPG/PNG) and video (MP4/AVI) samples on the training, validation, testing, post-processing
    and split endpoints, authenticated with a project x-api-key. Maximum 1000 files per request and 100
    MB per file. It documents real HTTP status codes (200, 400, 401, 421, 500), unlike the Studio API.
  humanURL: https://docs.edgeimpulse.com/apis/ingestion
  baseURL: https://ingestion.edgeimpulse.com
  tags:
  - Data Ingestion
  - Machine-Learning
  tags_raw:
  - Data Ingestion
  - Machine Learning
  properties:
  - type: Documentation
    url: https://docs.edgeimpulse.com/apis/ingestion
  - type: ErrorCatalog
