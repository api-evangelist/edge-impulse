  - type: Authentication
    url: authentication/edge-impulse-authentication.yml
- aid: edge-impulse:edge-impulse-remote-management-api
  name: Edge Impulse Remote Management API
  description: >-
    A two-way WebSocket protocol between edge devices and Edge Impulse Studio, used to drive a connected
    device — request a sample, follow acquisition progress and stream snapshot frames. Devices connect
    to wss://remote-mgmt.edgeimpulse.com and authenticate by sending their project API key in the Hello
    message; payloads may be JSON or CBOR. Protocol version 3, fully specified with a JSON Schema per
    message and covered by a public device conformance suite.
  humanURL: https://docs.edgeimpulse.com/apis/remote-management
  baseURL: https://remote-mgmt.edgeimpulse.com
  tags:
  - Devices
  - Streaming
  - IoT
  tags_raw:
  - Devices
  - Streaming
  - Internet of Things
  properties:
  - type: Documentation
    url: https://docs.edgeimpulse.com/tools/protocols/remote-management/websocket
  - type: AsyncAPI
