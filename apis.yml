aid: edge-impulse
url: https://raw.githubusercontent.com/api-evangelist/edge-impulse/refs/heads/main/apis.yml
name: Edge Impulse
description: 'Edge Impulse is the end-to-end edge AI MLOps platform for building datasets, training and
  optimizing machine learning models, and deploying them directly on device — from the smallest microcontrollers
  to gateways with the latest neural accelerators. The platform covers the whole workflow: sensor data
  collection and labeling, DSP feature engineering, model training with the EON Tuner and EON Compiler,
  hardware-aware profiling for latency, RAM and flash, and deployment as a C++ library, Arduino library,
  WebAssembly package, Docker container or prebuilt firmware. It is driven programmatically through three
  APIs — a 559-operation Studio API, an Ingestion API and a device Remote Management WebSocket — plus
  CLIs, Python/Node/Rust/Go SDKs and a first-party MCP server. Founded in 2019 by Zach Shelby and Jan
  Jongboom; acquired by Qualcomm Technologies in March 2025 and still operating under its own brand.'
