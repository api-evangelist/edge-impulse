  id_format: job-<epoch-millis>
  description: An asynchronous unit of work — feature generation, training, evaluation, deployment build,
    export.
  paths: 16
- name: Device
  key: deviceId
  description: A connected edge device registered to a project.
  paths: 9
- name: Deployment
  description: A built on-device artifact for a specific deployment target, now with a version history.
- name: ProjectVersion
  key: versionId
  description: A snapshot of a project. The only restore point the platform offers.
- name: ApiKey
  key: apiKeyId
  description: A project-scoped credential (ei_ prefix). Ingestion-only variants exist.
- name: HmacKey
  key: hmacId
