notes:
- The graph has no soft-delete or trash entity anywhere. ProjectVersion is the only rollback surface.
- Ids are integers with no type prefix, so an agent must never infer entity type from an id value.
- The Organization subtree is Enterprise-only; on the Developer plan it does not exist at all.
