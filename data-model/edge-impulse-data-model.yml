method: derived
source: https://studio.edgeimpulse.com/openapi.yml (481 paths, 670 component schemas) + openapi/edge-impulse-*-openapi.yml
provider: Edge Impulse
providerId: edge-impulse
description: 'Entity-relationship graph derived from the Edge Impulse Studio OpenAPI — path templates
  and id-reference fields across the 670 component schemas. The model is a two-root hierarchy: an Organization
  (Enterprise) owns Projects, and a Project owns everything else. 275 of 481 paths are scoped by {projectId}
  and 148 by {organizationId}; almost nothing exists outside one of those two roots, which is why a project-scoped
  API key is a genuine blast-radius boundary and a user JWT is not.'
id_conventions:
  style: integer surrogate keys
  note: Ids are plain integers, not prefixed strings — projectId 12345, not proj_12345. There is no type
    information in an id, so an agent cannot tell a projectId from an organizationId by looking at it.
    The one exception is the job id, a string of the form job-1569583053767.
entities:
- name: Organization
  key: organizationId
  root: true
  scope: Enterprise only
  description: 'Enterprise tenancy root: members, buckets, datasets, pipelines, portals, custom blocks,
