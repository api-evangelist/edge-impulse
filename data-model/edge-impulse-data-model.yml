- name: UploadPortal
  key: portalId
  description: A branded external upload surface for collecting data from third parties.
  paths: 12
- name: TransformationBlock
  key: transformationBlockId
  description: A custom organization block that transforms data.
- name: AIAction
  key: actionId
  description: A GenAI labelling/transform action with a preview-then-apply lifecycle.
  paths: 5
- name: Whitelabel
  key: whitelabelId
  alt_key: whitelabelIdentifier
