docs: https://docs.edgeimpulse.com/apis/studio#api-authentication-types
description: 'Authentication profile for the Edge Impulse API surface. Three key-based schemes are declared
  in the specs harvested into this repo; the currently published spec adds a fourth, an OAuth2 scheme
  with four flows. Which scheme you need is operation-dependent and stated in each operation description:
  project-scoped reads and writes take x-api-key, while user-scoped and organization-scoped operations
  say "only available through a JWT token".'
api_key_format:
  prefix: ei_
  issued_from: Studio project Dashboard > Keys
  scope: one project
  docs: https://docs.edgeimpulse.com/apis/studio#api-key
  ingestion_only_keys: The live spec adds ingestion-only project API keys (POST /api/{projectId}/apikeys/ingestiononly),
    a narrower credential for data upload.
jwt:
  obtained_by: POST /api-login (operationId login) with username and password
  header: x-jwt-token
  cookie: jwt
  mfa: TOTP MFA endpoints exist (userGenerateNewTotpMfaKey, userSetTotpMfaKey, userDeleteTotpMfaKey).
  docs: https://docs.edgeimpulse.com/apis/studio#jwt-token
other_credentials:
- name: HMAC key
  note: Per-project HMAC keys sign ingestion payloads (addProjectHmacKey / revokeProjectHmacKey). The
    ingestion acquisition format carries a protected/signature block.
- name: Remote management API key
  note: Devices send their project apiKey inside the WebSocket Hello message rather than as an HTTP header.
- name: MCP server credentials
  note: '@edgeimpulse/mcp-server reads EI_API_KEY or EI_JWT_TOKEN from the environment. A JWT there grants
    the agent every project and organization the user can see; a project key does not.'
sso:
  enterprise_only: true
  note: 'SSO and role-based access control are Enterprise-plan features (source: https://www.edgeimpulse.com/pricing).
    The status page lists a Keycloak component and the live spec exposes /api-sso/{usernameOrEmail}.'
